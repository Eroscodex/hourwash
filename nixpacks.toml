[providers]
providers = ['php', 'node']

[variables]
NIXPACKS_PHP_VERSION = '8.3'
NIXPACKS_PHP_EXTENSIONS = 'gd, pdo_mysql, mbstring, bcmath, ctype, curl, dom, fileinfo, openssl, pdo, tokenizer, xml, opcache'
COMPOSER_ALLOW_SUPERUSER = '1'
PHP_INI_UPLOAD_MAX_FILESIZE = '30M'
PHP_INI_POST_MAX_SIZE = '32M'
PHP_INI_MEMORY_LIMIT = '256M'

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'nodejs_20']

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev --ignore-platform-reqs'
]

[phases.build]
cmds = [
  'npm ci || npm install',
  'npm run build',
  'php artisan storage:link || true',
  'printf "upload_max_filesize = 30M\npost_max_size = 32M\nmemory_limit = 256M\n" > /etc/php/php.ini || printf "upload_max_filesize = 30M\npost_max_size = 32M\nmemory_limit = 256M\n" > /usr/local/etc/php/conf.d/uploads.ini || true'
]

[phases.start]
cmd = 'php artisan migrate --force --seed && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT'
