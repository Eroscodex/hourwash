[providers]
providers = ['php', 'node']

[variables]
NIXPACKS_PHP_VERSION = '8.5'
COMPOSER_ALLOW_SUPERUSER = '1'

[phases.setup]
nixPkgs = ['php85', 'php85Extensions.pdo_mysql', 'php85Extensions.mbstring', 'php85Extensions.gd', 'composer', 'nodejs_20']

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev --ignore-platform-req=ext-gd'
]

[phases.build]
cmds = [
  'npm ci || npm install',
  'npm run build'
]

[phases.start]
cmd = 'php artisan migrate --force --seed && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT'
