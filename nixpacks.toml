[providers]
providers = ['php', 'node']

[variables]
NIXPACKS_PHP_VERSION = '8.3'
NIXPACKS_PHP_EXTENSIONS = 'gd, pdo_mysql, mbstring, bcmath, ctype, curl, dom, fileinfo, openssl, pdo, tokenizer, xml'
COMPOSER_ALLOW_SUPERUSER = '1'

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'nodejs_20']

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev --ignore-platform-reqs'
]

[phases.build]
cmds = [
  'npm ci || npm install',
  'npm run build'
]

[phases.start]
cmd = 'php artisan migrate --force --seed && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT'
